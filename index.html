// ── Fetch Spotify podcast RSS (Spotify exposes RSS for most shows) ──
async function fetchSpotifyRSS(showId) {
  if (!showId) return [];
  // Spotify RSS feeds via anchor or other aggregators
  const feeds = [
    `https://feeds.buzzsprout.com/${showId}.rss`,
    `https://anchor.fm/s/${showId}/podcast/rss`,
  ];
  // Most reliable: use the show's own RSS (stored in rssFeed)
  // This is a fallback if rssFeed is a podcast feed
  return [];
}

// ── Google News RSS per person (catches mainstream press coverage) ──
async function fetchGoogleNews(searchQuery) {
  if (!searchQuery) return [];
  const url = `https://news.google.com/rss/search?q=${encodeURIComponent(searchQuery)}&hl=en-US&gl=US&ceid=US:en`;
  const xml = await proxiedFetch(url);
  const items = parseRSS(xml);
  // Tag source as Google News
  return items.map(i => ({ ...i, source: i.source || 'Google News', via: 'google-news' }));
}

// ── Main fetch function for one person ──
async function fetchLiveData(personId) {
  const allPeople = [...(window.LONGEVITY_DB?.people || []), ...(window.customPeople || [])];
  const p = allPeople.find(x => x.id === personId);
  if (!p) return null;

  // Check cache
  const cached = liveCache[personId];
  if (cached && (Date.now() - cached.timestamp) < CACHE_TTL) {
    return cached.data;
  }

  const feeds = getPersonFeeds(p);
  const result = { news: [], youtube: [], podcasts: [], fetchedAt: new Date() };

  // Skip proxy-dependent fetches if running from file:// (they will always fail)
  const isFileProtocol = location.protocol === 'file:';
  
  // Kick off fetches in parallel — skip RSS/Google News on file://
  const rssPromise = (feeds.rssFeed && !isFileProtocol) ? proxiedFetch(feeds.rssFeed).then(parseRSS).catch(() => []) : Promise.resolve([]);
  const gnPromise  = (p.rssSearch && !isFileProtocol) ? fetchGoogleNews(p.rssSearch).catch(() => []) : Promise.resolve([]);
  // YouTube API supports CORS — works even from file://
  const ytFallbackQuery = p.name;
  const ytPromise  = YT_API_KEY ? fetchYouTube(feeds.ytChannel, ytFallbackQuery).catch(() => []) : Promise.resolve([]);
  
  // PROGRESSIVE: render YouTube immediately when it returns (usually <1s)
  // — don't make user wait for slow RSS proxies
  ytPromise.then(videos => {
    if (videos && videos.length) {
      result.youtube = videos;
      // Partial render if this person's tab is still visible
      if (typeof applyLiveData === 'function') {
        const partial = { ...result, youtube: videos, news: result.news };
        applyLiveData(personId, partial);
      }
    }
  });
  
  // Wait for the rest
  const [ownNews, googleNews, ytVideos] = await Promise.all([rssPromise, gnPromise, ytPromise]);

  // Merge + dedupe news from both sources
  const allNews = [...ownNews, ...googleNews];
  const seen = new Set();
  result.news = allNews.filter(item => {
    const key = (item.title || '').toLowerCase().trim();
    if (seen.has(key) || !key) return false;
    seen.add(key);
    return true;
  }).slice(0, 10);

  result.youtube = ytVideos;

  // Cache it
  liveCache[personId] = { data: result, timestamp: Date.now() };
  return result;
}

// ── Update the news tab UI with live data ──
function applyLiveData(personId, liveData) {
  if (!liveData) return;

  // Update news items
  if (liveData.news && liveData.news.length > 0) {
    const newsContainer = document.getElementById('live-news-' + personId);
    if (newsContainer) {
      newsContainer.innerHTML = liveData.news.map((item, i) => `
        <a class="news-card live-item-new" href="${item.url}" target="_blank" rel="noopener noreferrer">
          <div class="news-card-index">${String(i+1).padStart(2,'0')}</div>
          <div class="news-card-body">
            <div class="news-card-title">${item.title}</div>
            <div class="news-card-meta">
              <span class="news-card-date">${item.date}</span>
              <span class="news-card-source">${item.source}</span>
              <span style="font-size:9px;background:rgba(34,197,94,.15);color:var(--green);
                    border:1px solid rgba(34,197,94,.3);border-radius:4px;padding:1px 5px;
                    font-weight:700">LIVE</span>
            </div>
          </div>
          <div class="news-card-arrow">↗</div>
        </a>`).join('');
    }
  }

  // Update YouTube items
  const ytContainer = document.getElementById('live-youtube-' + personId);
  if (ytContainer) {
    if (liveData.youtube && liveData.youtube.length > 0) {
      // Cache videos for filter toggle
      window._ytVideoCache = window._ytVideoCache || {};
      window._ytVideoCache[personId] = liveData.youtube;
      // Default filter: both
      const currentFilter = window._ytFilter?.[personId] || 'both';
      renderYtVideos(personId, currentFilter);
    } else if (lastYtError) {
      // Fetch attempted and failed — show clear error
      ytContainer.innerHTML = `
        <div class="np-empty" style="padding:24px 20px;text-align:center">
          <div style="font-size:28px;margin-bottom:8px">⚠️</div>
          <div style="font-size:13px;font-weight:700;color:var(--amber);margin-bottom:6px">YouTube fetch failed</div>
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:12px;line-height:1.5;max-width:340px;margin-left:auto;margin-right:auto">${lastYtError}</div>
          <a href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noopener"
             style="display:inline-block;padding:6px 12px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:6px;color:var(--text-secondary);font-size:11px;font-weight:600;text-decoration:none">
            Check API Key Settings ↗
          </a>
        </div>`;
    } else if (liveData.youtube !== undefined) {
      // Fetch completed but returned no videos (and no error) — clear placeholder
      ytContainer.innerHTML = `
        <div class="np-empty" style="padding:20px;text-align:center">
          <div style="font-size:20px;margin-bottom:6px;opacity:.4">▶</div>
          <div style="font-size:11px;color:var(--text-muted)">No recent videos returned from YouTube API</div>
        </div>`;
    }
  }

  // status is updated by refreshNewsTab after this returns
}

// ── Refresh status indicator ──
// ── Render YouTube videos with filter support (channel / interviews / both) ──
function renderYtVideos(personId, filter) {
  window._ytFilter = window._ytFilter || {};
  window._ytFilter[personId] = filter;
  
  // Update the count badge to show total
  const countEl = document.getElementById('yt-count-' + personId);
  if (countEl) {
    const total = (window._ytVideoCache?.[personId] || []).length;
    countEl.textContent = total;
  }
  
  const allVideos = (window._ytVideoCache && window._ytVideoCache[personId]) || [];
  let filtered = allVideos;
  if (filter === 'channel') {
    filtered = allVideos.filter(v => v.source === 'channel');
  } else if (filter === 'interviews') {
    filtered = allVideos.filter(v => v.source === 'interview');
  }
  
  const ytContainer = document.getElementById('live-youtube-' + personId);
  if (!ytContainer) return;
  
  if (filtered.length === 0) {
    ytContainer.innerHTML = `
      <div class="np-empty" style="padding:24px 20px;text-align:center">
        <div style="font-size:22px;margin-bottom:6px;opacity:.4">▶</div>
        <div style="font-size:12px;color:var(--text-muted)">No ${filter === 'channel' ? 'own-channel videos' : filter === 'interviews' ? 'interviews about them' : 'videos'} found.</div>
      </div>`;
    return;
  }
  
  ytContainer.innerHTML = filtered.map((item, i) => {
    const badgeColor = item.source === 'channel' ? '#8b5cf6' : '#22c55e';
    const badgeLabel = item.source === 'channel' ? 'OWN' : 'INT';
    const badgeTitle = item.source === 'channel' ? 'From their own YouTube channel' : 'Interview / mention on another channel';
    return `
    <a class="yt-item live-item-new media-clickable" href="${item.url}"
       data-url="${encodeURIComponent(item.url || '')}"
       data-title="${encodeURIComponent(item.title || '')}"
       data-meta="${encodeURIComponent((item.channel||'') + ' · ' + (item.date||''))}"
       style="cursor:pointer">
      <div class="yt-num">${String(i+1).padStart(2,'0')}</div>
      <div style="flex:1;min-width:0">
        <div class="yt-title">${item.title}</div>
        <div class="yt-meta">
          <span class="yt-date">${item.date}</span>
          <span class="yt-channel">${item.channel}</span>
          <span title="${badgeTitle}" style="font-size:9px;background:${badgeColor}22;color:${badgeColor};
                border:1px solid ${badgeColor}50;border-radius:4px;padding:1px 5px;
                font-weight:700">${badgeLabel}</span>
        </div>
      </div>
      <div class="yt-arrow">▶</div>
    </a>`;
  }).join('');
}

// Switch YouTube filter
function setYtFilter(personId, filter) {
  window._ytFilter = window._ytFilter || {};
  window._ytFilter[personId] = filter;
  renderYtVideos(personId, filter);
  // Update button active state
  document.querySelectorAll('[data-yt-filter-btn="' + personId + '"]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.ytFilterValue === filter);
  });
}


function updateRefreshStatus(personId, state, time, stats) {
  const dot  = document.getElementById('rdot-' + personId);
  const text = document.getElementById('rtext-' + personId);
  if (!dot || !text) return;
  dot.className = 'refresh-dot ' + state;
  const ytNote = YT_API_KEY ? '' : ' · YouTube disabled (no API key)';
  if (state === 'live' && time) {
    const timeStr = time.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const newsCount = stats?.news || 0;
    const ytCount = stats?.youtube || 0;
    text.innerHTML = `<span style="color:var(--green)">●</span> Live · ${newsCount} articles${ytCount ? `, ${ytCount} videos` : ''} · updated ${timeStr}${ytNote}`;
  } else if (state === 'loading') {
    text.textContent = 'Fetching RSS + Google News' + (YT_API_KEY ? ' + YouTube…' : '…');
  } else if (state === 'error') {
    text.textContent = 'Fetch failed — showing static data (open in browser, not file://)';
  } else {
    text.innerHTML = `Click <strong>Refresh</strong> to pull live news from RSS + Google News${YT_API_KEY ? ' + YouTube' : ''}`;
  }
}

// ── Main trigger: fetch + render for current person ──
async function refreshNewsTab(personId, opts = {}) {
  const btn = document.getElementById('rbtn-' + personId);
  if (btn) { btn.disabled = true; btn.classList.add('spinning'); }
  updateRefreshStatus(personId, 'loading', null);

  // Only show AI loading / trigger AI if this is a user-triggered refresh
  // (skips the auto-fetch on tab-open to conserve Gemini quota)
  const userTriggered = opts.userTriggered !== false;
  const aiContainer = document.getElementById('ai-panel-' + personId);
  if (userTriggered && aiContainer) {
    aiContainer.innerHTML = renderAiSummaryPanel(personId, null, true);
  } else if (aiContainer && !aiCache[personId]) {
    // On initial auto-fetch, show placeholder prompting user to click refresh
    aiContainer.innerHTML = `
      <div class="ai-panel">
        <div class="ai-panel-header">
          <div class="ai-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#e879f9"><path d="M12 2l2.09 6.26L20 9.27l-5 4.87L16.18 21 12 17.77 7.82 21 9 14.14l-5-4.87 5.91-.01L12 2z"/></svg>
            AI Analysis
          </div>
          <div class="ai-status" style="color:var(--text-muted)"><span class="ai-dot"></span> Click Refresh to generate</div>
        </div>
        <div class="ai-panel-body" style="font-size:12px;color:var(--text-muted);padding:14px 18px">
          AI summary is cached for 6 hours and persists across page reloads. Click <strong>↻ Refresh Live Feeds</strong> to fetch fresh data and generate the AI analysis.
        </div>
      </div>`;
  }

  try {
    const data = await fetchLiveData(personId);
    applyLiveData(personId, data);
    const stats = { news: data?.news?.length || 0, youtube: data?.youtube?.length || 0 };
    updateRefreshStatus(personId, 'live', data?.fetchedAt || new Date(), stats);
    
    // Only call Gemini on user-triggered refresh (conserves quota)
    if (userTriggered) {
      generateAiNewsSummary(personId, data).then(aiData => {
        const c = document.getElementById('ai-panel-' + personId);
        if (c) c.innerHTML = renderAiSummaryPanel(personId, aiData, false);
      });
    } else if (aiCache[personId]) {
      // Show cached AI if available (no new API call)
      const c = document.getElementById('ai-panel-' + personId);
      if (c) c.innerHTML = renderAiSummaryPanel(personId, aiCache[personId].data, false);
    }
  } catch(e) {
    console.error('Fetch failed:', e);
    updateRefreshStatus(personId, 'error', null);
  } finally {
    if (btn) { btn.disabled = false; btn.classList.remove('spinning'); }
  }
}

// ── Auto-fetch when news tab opens ──
function autoFetchOnNewsTab(personId) {
  // Small delay so DOM is rendered first
  // Pass userTriggered: false so AI doesn't auto-fire (saves Gemini quota)
  setTimeout(() => refreshNewsTab(personId, { userTriggered: false }), 300);
}

<script>
// ═════════════════════════════════════════════════════════════════
// MEDIA MODAL — embedded YouTube/Spotify players
// ═════════════════════════════════════════════════════════════════

let _currentMediaUrl = '';

// Global click delegation for any .media-clickable card
// This is more reliable than inline onclick= with escaped strings
document.addEventListener('click', function(e) {
  const card = e.target.closest('.media-clickable');
  if (!card) return;
  e.preventDefault();
  e.stopPropagation();
  const url = decodeURIComponent(card.dataset.url || '');
  const title = decodeURIComponent(card.dataset.title || '');
  const meta = decodeURIComponent(card.dataset.meta || '');
  if (!url) return;
  
  // YouTube URLs → open in sized popup window (avoids all embed restrictions)
  if (/youtube\.com\/watch|youtu\.be\//.test(url)) {
    openYouTubePopup(url, title);
    return;
  }
  // Spotify + everything else → existing modal with embed
  openMediaModal(url, title, meta);
}, true);

// Open YouTube in a sized popup browser window
// This is a real window.open() call, not an iframe — bypasses X-Frame-Options
function openYouTubePopup(url, title) {
  const w = 1280, h = 780;
  const left = Math.max(0, (screen.width - w) / 2);
  const top  = Math.max(0, (screen.height - h) / 2);
  const features = `width=${w},height=${h},left=${left},top=${top},popup=yes,scrollbars=yes,resizable=yes`;
  const popup = window.open(url, 'yt_popup_' + Date.now(), features);
  
  // Popup blocker fallback — if window.open returns null, show a friendly message
  if (!popup || popup.closed || typeof popup.closed === 'undefined') {
    // Popup was blocked. Show a small notice and offer direct link.
    showPopupBlockedNotice(url, title);
  } else {
    try { popup.focus(); } catch(_){}
  }
}

function showPopupBlockedNotice(url, title) {
  // Lightweight inline toast — no modal needed
  const existing = document.getElementById('popup-blocked-toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.id = 'popup-blocked-toast';
  toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10001;background:var(--bg-surface);border:1px solid var(--amber);border-radius:var(--radius);padding:14px 18px;box-shadow:0 12px 40px rgba(0,0,0,.6);max-width:480px;display:flex;align-items:center;gap:12px';
  toast.innerHTML = `
    <div style="font-size:20px">⚠️</div>
    <div style="flex:1;font-size:12px;line-height:1.4;color:var(--text-secondary)">
      <div style="font-weight:700;color:var(--amber);margin-bottom:2px">Popup blocked</div>
      Allow popups for this site in your browser settings, or
    </div>
    <a href="${url}" target="_blank" rel="noopener" style="padding:6px 12px;background:#FF0000;color:white;border-radius:4px;text-decoration:none;font-size:11px;font-weight:700;white-space:nowrap">Open ↗</a>
    <button onclick="this.parentElement.remove()" style="background:transparent;border:none;color:var(--text-muted);font-size:18px;cursor:pointer">×</button>`;
  document.body.appendChild(toast);
  setTimeout(() => { if (toast.parentElement) toast.remove(); }, 8000);
}

function openMediaModal(url, title, extraMeta) {
  _currentMediaUrl = url;
  
  // YouTube detection — ALWAYS open in popup browser window (bypasses all embed restrictions)
  const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{11})/);
  if (ytMatch) {
    // Open native YouTube watch page in a sized popup window
    // This avoids iframe embedding restrictions entirely
    const popupWidth = Math.min(1280, window.screen.width - 100);
    const popupHeight = Math.min(720, window.screen.height - 100);
    const left = (window.screen.width - popupWidth) / 2;
    const top = (window.screen.height - popupHeight) / 2;
    const features = `width=${popupWidth},height=${popupHeight},left=${left},top=${top},popup=yes,noopener=no,noreferrer=no`;
    const popup = window.open(url, 'ytPlayer_' + ytMatch[1], features);
    if (!popup || popup.closed) {
      // Popup blocked — fall back to new tab
      window.open(url, '_blank', 'noopener');
    } else {
      popup.focus();
    }
    return;  // don't open the modal at all for YouTube
  }
  
  // Non-YouTube media continues to use the modal (Spotify embeds work fine)
  const modal = document.getElementById('mediaModal');
  const icon  = document.getElementById('mediaModalIcon');
  const titleEl = document.getElementById('mediaModalTitle');
  const metaEl  = document.getElementById('mediaModalMeta');
  const body  = document.getElementById('mediaModalBody');
  if (!modal || !body) return;

  // Detect media type
  let embedSrc = '';
  let mediaType = 'other';
  let iconHtml = '';
  let isSpotify = false;

  // Spotify episode
  if (url.includes('spotify.com/episode/')) {
    mediaType = 'spotify';
    isSpotify = true;
    const spMatch = url.match(/episode\/([A-Za-z0-9]+)/);
    if (spMatch) embedSrc = `https://open.spotify.com/embed/episode/${spMatch[1]}?theme=0`;
    iconHtml = spotifyIconHtml();
  }
  // Spotify show
  else if (url.includes('spotify.com/show/')) {
    mediaType = 'spotify';
    isSpotify = true;
    const spMatch = url.match(/show\/([A-Za-z0-9]+)/);
    if (spMatch) embedSrc = `https://open.spotify.com/embed/show/${spMatch[1]}?theme=0`;
    iconHtml = spotifyIconHtml();
  }

  icon.innerHTML = iconHtml || `<span style="font-size:20px">🔗</span>`;
  titleEl.textContent = title || 'Media';
  metaEl.textContent = extraMeta || '';

  if (embedSrc) {
    body.className = 'media-modal-body' + (isSpotify ? ' spotify-mode' : '');
    if (isSpotify) {
      body.innerHTML = `<iframe src="${embedSrc}" style="border-radius:12px;width:100%;height:232px;max-width:600px"
        frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"></iframe>`;
    } else {
      // YouTube branch is handled via popup at top of openMediaModal, never reached
    }
  } else {
    // Can't embed (e.g. news article) — show fallback link
    body.className = 'media-modal-body spotify-mode';
    body.innerHTML = `
      <div style="text-align:center;padding:40px 20px">
        <div style="font-size:40px;margin-bottom:16px">📰</div>
        <div style="font-size:14px;color:var(--text-primary);margin-bottom:6px;font-weight:600">News articles open in a new tab</div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:20px">Most news sites block inline embedding for security</div>
        <a href="${url}" target="_blank" rel="noopener" onclick="closeMediaModal()"
           style="display:inline-block;padding:10px 20px;background:var(--person-accent);color:var(--text-inverse);
                  border-radius:var(--radius-sm);font-size:13px;font-weight:600;text-decoration:none">
          Open Article ↗
        </a>
      </div>`;
  }

  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

// Load YT IFrame Player API once per session, then create a player with error handling
let _ytApiReady = false;
let _ytApiLoading = false;
let _ytApiQueue = [];

function loadYTApiAndCreatePlayer(playerDivId, videoId) {
  const createPlayer = () => {
    try {
      new YT.Player(playerDivId, {
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          rel: 0,
          modestbranding: 1,
          playsinline: 1
        },
        events: {
          onReady: (e) => { try { e.target.playVideo(); } catch(_){} },
          onError: (e) => {
            // Codes 101, 150, 153 = "embedding not allowed by owner"
            // Code 100 = video not found / private
            // Code 2 = invalid param
            const showFallback = () => {
              const pdiv = document.getElementById(playerDivId);
              const fb = document.getElementById(playerDivId + '-fallback');
              if (pdiv) pdiv.style.display = 'none';
              if (fb) fb.style.display = 'flex';
            };
            console.warn('[YT Player] error code:', e.data, '— showing fallback');
            showFallback();
          }
        }
      });
    } catch (err) {
      console.warn('[YT Player] create failed:', err);
      const pdiv = document.getElementById(playerDivId);
      const fb = document.getElementById(playerDivId + '-fallback');
      if (pdiv) pdiv.style.display = 'none';
      if (fb) fb.style.display = 'flex';
    }
  };
  
  if (_ytApiReady) {
    createPlayer();
    return;
  }
  
  _ytApiQueue.push(createPlayer);
  
  if (!_ytApiLoading) {
    _ytApiLoading = true;
    // Callback YT API will invoke when ready
    window.onYouTubeIframeAPIReady = function() {
      _ytApiReady = true;
      _ytApiLoading = false;
      while (_ytApiQueue.length) _ytApiQueue.shift()();
    };
    // Load the script
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = () => {
      console.warn('[YT API] script failed to load — falling back to all videos');
      // Show fallback for every queued player
      _ytApiLoading = false;
      _ytApiQueue.forEach(fn => {
        // Each createPlayer call tries new YT.Player which will throw, triggering fallback
        try { fn(); } catch(_) {}
      });
      _ytApiQueue = [];
    };
    document.head.appendChild(tag);
  }
}

function closeMediaModal() {
  const modal = document.getElementById('mediaModal');
  const body  = document.getElementById('mediaModalBody');
  if (modal) modal.classList.remove('open');
  if (body) body.innerHTML = '';  // stop playback
  document.body.style.overflow = '';
  _currentMediaUrl = '';
}

function openMediaExternal() {
  if (_currentMediaUrl) window.open(_currentMediaUrl, '_blank', 'noopener');
  closeMediaModal();

  <button onclick="document.getElementById('fileProtocolWarning').style.display='none'"
          style="background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);
                 color:white;padding:3px 10px;border-radius:4px;margin-left:12px;cursor:pointer;font-weight:600">Dismiss</button>
</div>
<script>
  // Show warning if file://
  if (location.protocol === 'file:') {
    document.addEventListener('DOMContentLoaded', () => {

      if (w) w.style.display = 'block';
      document.body.style.paddingTop = '44px';

  }
</script>
