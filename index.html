a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg-surface)}
::-webkit-scrollbar-thumb{background:var(--border-bright);border-radius:99px}

/* ================================================================
   HEADER
================================================================ */
.app-header {
  position: sticky; top:0; z-index:100;
  background: rgba(14,17,24,.92);
  border-bottom: 1px solid var(--border);
  padding: 0 24px; height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
[data-theme="light"] .app-header {
  background: rgba(255,255,255,.92);
}
.header-logo {
  display: flex; align-items: center; gap: 9px;
  font-weight: 700; font-size: 15px; letter-spacing: -.02em;
}
.logo-icon{ width:26px; height:26px }
.header-actions{ display:flex; align-items:center; gap:7px }
.btn-icon {
  width:30px; height:30px; border-radius:var(--radius-sm);
  background:var(--bg-card); border:1px solid var(--border);
  color:var(--text-secondary); display:flex; align-items:center; justify-content:center;
  transition:var(--transition); font-size:14px;
}
.btn-icon:hover{background:var(--bg-elevated);color:var(--text-primary)}

/* ================================================================
   PERSON SELECTOR — slim initials row, NO photos
================================================================ */
.person-selector {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 24px;
  display: flex; align-items: center; gap: 8px;
  overflow-x: auto;
  position: relative;
}
.person-selector::after {
  content:''; position:absolute; bottom:0; left:0; right:0; height:1px;
  background: linear-gradient(90deg, transparent, var(--person-accent), transparent);
  opacity:.4;
}
.person-chip {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 7px;
  cursor: pointer;
  padding: 5px 13px;
  border-radius: 99px;
  border: 1.5px solid var(--border);
  background: var(--bg-card);
  transition: var(--transition);
  white-space: nowrap;
  position: relative;
}
.person-chip:hover {
  border-color: var(--person-accent);
  background: var(--bg-elevated);
}
.person-chip.active {
  border-color: var(--person-accent);
  background: linear-gradient(135deg, rgba(var(--pa-r,0),var(--pa-g,212),var(--pa-b,255),.12), var(--bg-elevated));
  box-shadow: 0 0 0 1px var(--person-accent), 0 2px 8px rgba(0,0,0,.3);
}
.chip-initials {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--bg-elevated);
  border: 1.5px solid var(--border-bright);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 800;
  color: var(--person-accent);
  flex-shrink: 0;
}
.chip-name {
  font-size: 12px; font-weight: 600;
  color: var(--text-secondary);
}
.person-chip.active .chip-name { color: var(--text-primary) }
.person-chip.all-chip .chip-initials {
  background: linear-gradient(135deg, #00d4ff22, #8b5cf622);
  border-color: var(--border-bright);
  font-size: 8px;
  color: var(--text-secondary);
}
.add-person-btn {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 99px;
  border: 1.5px dashed var(--border-bright);
  background: transparent;
  color: var(--text-muted);
  font-size: 12px; font-weight: 600;
  display: flex; align-items: center; gap: 5px;
  cursor: pointer; transition: var(--transition);
}
.add-person-btn:hover{border-color:var(--accent);color:var(--accent)}
.my-stack-chip:hover{border-color:#e879f9!important;background:var(--bg-elevated)}
.my-stack-chip.active{border-color:#e879f9!important;box-shadow:0 0 0 1px #e879f9}
/* PHOTO CHIP */
.chip-photo {
  width: 24px; height: 24px; border-radius: 50%;
  object-fit: cover; object-position: center top;
  border: 1.5px solid var(--border-bright);
  flex-shrink: 0;
  transition: var(--transition);
}
.person-chip.active .chip-photo { border-color: var(--person-accent); }

/* ================================================================
   MAIN
================================================================ */
.main{ max-width:1440px; margin:0 auto; padding:24px }

/* ================================================================
   HERO — photo lives HERE
================================================================ */
.person-hero {
  display: flex; align-items: flex-start; gap: 20px;
  padding: 18px 22px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 14px;
  position: relative; overflow: hidden;
}
.person-hero::before {
  content:''; position:absolute; top:0; left:0; right:0;
  height: 3px; background: var(--person-accent);
}
.person-hero::after {
  content:''; position:absolute; top:-60px; right:-60px;
  width:200px; height:200px; border-radius:50%;
  background: radial-gradient(circle, var(--person-accent) 0%, transparent 70%);
  opacity:.04; pointer-events:none;
}
/* Big portrait in the hero */
.hero-photo-wrap {
  flex-shrink: 0;
  width: 108px; height: 135px;
  border-radius: var(--radius);
  overflow: hidden;
  border: 2px solid var(--person-accent);
  box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 6px 20px rgba(0,0,0,.5);
  background: var(--bg-elevated);
  position: relative;
}
.hero-photo-wrap::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,.25));
  pointer-events: none;
}
.hero-photo {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center 15%;
  display: block;
  transition: transform 0.4s ease;
}
.hero-photo-wrap:hover .hero-photo { transform: scale(1.04) }
.hero-photo-fallback {
  width:100%; height:100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; font-weight: 800;
  color: var(--person-accent);
  background: linear-gradient(135deg, var(--bg-elevated), var(--bg-card));
}
.hero-info{ flex:1; min-width:0 }
.hero-name{
  font-size: 22px; font-weight: 800;
  letter-spacing: -.03em; margin-bottom: 1px;
  font-family: var(--font-display);
}
.hero-title{ color:var(--text-secondary); font-size:12px; margin-bottom:4px }
.hero-tagline{
  font-size:12px; color:var(--person-accent);
  font-weight:500; font-style:italic; margin-bottom:6px;
}
.hero-bio{ font-size:12px; color:var(--text-secondary); line-height:1.45; max-width:640px }
.hero-meta{
  display:flex; align-items:center; gap:8px;
  margin-top:8px; flex-wrap:wrap;
}
.hero-badge{
  font-size:11px; font-weight:600; padding:3px 8px;
  border-radius:99px; border:1px solid var(--border-bright);
  color:var(--text-secondary); background:var(--bg-card);
}
.hero-badge.accent{ border-color:var(--person-accent); color:var(--person-accent) }
.hero-link{
  font-size:11px; font-weight:600; padding:3px 8px;
  border-radius:99px; color:var(--accent);
  background:rgba(0,212,255,.08); border:1px solid rgba(0,212,255,.2);
  transition:var(--transition);
}
.hero-link:hover{ background:rgba(0,212,255,.15) }

/* ALL composite hero */
.all-hero {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 24px;
  overflow: hidden;
  position: relative;
}
.all-hero::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(ellipse at 80% 0%, rgba(0,212,255,.04) 0%, transparent 60%),
              radial-gradient(ellipse at 20% 100%, rgba(168,85,247,.03) 0%, transparent 60%);
}
.all-hero-top {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px;
}
.all-photo-strip {
  display: flex; gap: -8px;
  position: relative;
}
.all-photo-strip .strip-photo {
  width: 44px; height: 44px; border-radius: 50%;
  object-fit: cover; object-position: center top;
  border: 2px solid var(--bg-surface);
  margin-left: -10px;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.4);
  transition: transform .2s, box-shadow .2s;
}
.all-photo-strip .strip-photo:first-child{ margin-left:0 }
.all-photo-strip .strip-photo:hover {
  transform: translateY(-3px) scale(1.08);
  box-shadow: 0 6px 16px rgba(0,0,0,.5);
  z-index: 2; position: relative;
}
.all-photo-strip .strip-fallback {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800;
  border: 2px solid var(--bg-surface);
  margin-left: -10px; flex-shrink: 0;
}
.all-hero-title{
  font-size:20px; font-weight:700; letter-spacing:-.02em;
  font-family: var(--font-display);
}
.all-hero-sub{
  font-size:13px; color:var(--text-secondary); margin-top:2px;
}
.all-aggregate-stats {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  border-top: 1px solid var(--border);
}
.agg-stat {
  padding: 16px 20px;
  border-right: 1px solid var(--border);
}
.agg-stat:last-child{ border-right:none }
.agg-stat-val {
  font-size: 24px; font-weight: 700; font-family: var(--font-mono);
  letter-spacing: -.02em; color: var(--accent);
  text-shadow: 0 0 20px rgba(0,212,255,.25);
}
.agg-stat-label{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted) }
.agg-stat-sub{ font-size:11px; color:var(--text-muted); margin-top:3px }

/* ================================================================
   STATS
================================================================ */
.stats-grid{
  display:grid; grid-template-columns:repeat(6,1fr);
  gap:8px; margin-bottom:14px;
}
.stat-card{
  padding:9px 11px; background:var(--bg-surface);
  border:1px solid var(--border); border-radius:var(--radius);
  transition:var(--transition); position:relative; overflow:hidden;
}
.stat-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, var(--person-accent), transparent);
  opacity:.6;
}
.stat-card:hover{ border-color:var(--person-accent); background:var(--bg-elevated); transform:translateY(-1px) }
.stat-value{
  font-size:15px; font-weight:700; letter-spacing:-.02em;
  color:var(--person-accent); margin-bottom:1px; font-family:var(--font-mono);
  line-height:1.1;
}
.stat-label{ font-size:9px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.06em; margin-bottom:1px }
.stat-desc{ font-size:10px; color:var(--text-muted); margin-top:1px; line-height:1.3 }

/* ================================================================
   TABS
================================================================ */
.tab-bar{
  display:flex; gap:2px; border-bottom:1px solid var(--border);
  margin-bottom:24px; overflow-x:auto;
}
.tab-btn{
  padding:9px 16px; font-size:13px; font-weight:500;
  color:var(--text-secondary); border-bottom:2px solid transparent;
  margin-bottom:-1px; transition:var(--transition); white-space:nowrap; background:none;
}
.tab-btn:hover{ color:var(--text-primary) }
.tab-btn.active{ 
  color:var(--person-accent); 
  border-bottom-color:var(--person-accent);
  text-shadow: 0 0 12px var(--person-accent);
}

/* ================================================================
   FILTERS
================================================================ */
.filter-bar{
  display:flex; gap:10px; margin-bottom:16px;
  flex-wrap:wrap; align-items:center;
}
.filter-input{
  flex:1; min-width:200px; padding:8px 12px;
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius-sm); color:var(--text-primary);
  font-size:13px; transition:var(--transition); outline:none;
}
.filter-input:focus{ border-color:var(--border-bright) }
.filter-select{
  padding:8px 12px; background:var(--bg-card);
  border:1px solid var(--border); border-radius:var(--radius-sm);
  color:var(--text-primary); font-size:13px; cursor:pointer; outline:none;
}
.filter-chip{
  padding:5px 10px; font-size:12px; font-weight:500;
  border-radius:99px; border:1px solid var(--border);
  color:var(--text-secondary); background:var(--bg-card);
  cursor:pointer; transition:var(--transition); white-space:nowrap;
}
.filter-chip:hover{ border-color:var(--border-bright); color:var(--text-primary) }
.filter-chip.active{ background:var(--person-accent); border-color:var(--person-accent); color:var(--text-inverse) }

/* ================================================================
   TABLE + SPLIT
================================================================ */
.table-wrap{
  background:var(--bg-surface); border:1px solid var(--border);
  border-radius:var(--radius-lg); overflow:hidden;
}
.recs-table{ width:100%; border-collapse:collapse }
.recs-table th{
  padding:10px 16px; text-align:left; font-size:11px; font-weight:600;
  text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted);
  background:var(--bg-card); border-bottom:1px solid var(--border); white-space:nowrap;
}
.recs-table td{
  padding:12px 16px; border-bottom:1px solid var(--border);
  font-size:13px; vertical-align:top;
}
.recs-table tr:last-child td{ border-bottom:none }
.recs-table tr{ cursor:pointer; transition:var(--transition) }
.recs-table tr:hover td{ background:var(--bg-elevated) }
.recs-table tr.selected td{ 
  background:rgba(0,212,255,.06);
  border-left: 2px solid var(--person-accent);
}
.recs-table tr.selected td:not(:first-child) { border-left: none; }

.badge{ display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:99px; font-size:11px; font-weight:600; white-space:nowrap }
.badge-primary  { background:rgba(34,197,94,.12); color:#22c55e; border:1px solid rgba(34,197,94,.25) }
.badge-secondary{ background:rgba(245,158,11,.12); color:#f59e0b; border:1px solid rgba(245,158,11,.25) }
.badge-commentary{ background:rgba(168,85,247,.12); color:#a855f7; border:1px solid rgba(168,85,247,.25) }
.badge-current  { background:rgba(34,197,94,.12); color:#22c55e; border:1px solid rgba(34,197,94,.25) }
.badge-archived { background:rgba(239,68,68,.12); color:#ef4444; border:1px solid rgba(239,68,68,.25) }

.confidence{ display:flex; gap:3px; align-items:center }
.conf-dot{ width:7px; height:7px; border-radius:50%; background:var(--border-bright) }
.conf-dot.filled{ background:var(--person-accent) }

.topic-tag{
  font-size:11px; font-weight:600; padding:2px 7px;
  border-radius:4px; background:var(--bg-card);
  border:1px solid var(--border); color:var(--text-muted); white-space:nowrap;
}

.split-layout{
  display:grid; grid-template-columns:1fr 380px;
  gap:20px; align-items:start;
}
.detail-panel{
  background:var(--bg-surface); border:1px solid var(--border);
  border-radius:var(--radius-lg); overflow:hidden;
  position:sticky; top:72px;
}
.detail-empty{ padding:48px 24px; text-align:center; color:var(--text-muted); font-size:13px }
.detail-empty-icon{ font-size:32px; margin-bottom:12px; opacity:.4 }
.detail-header{
  padding:20px 20px 16px; border-bottom:1px solid var(--border);
  background:var(--bg-card); position:relative;
}
.detail-header::before{
  content:''; position:absolute; top:0; left:0; right:0;
  height:2px; background:var(--person-accent);
}
.detail-title{ font-size:15px; font-weight:700; letter-spacing:-.02em; line-height:1.3; margin-bottom:8px }
.detail-meta{ display:flex; gap:8px; align-items:center; flex-wrap:wrap }
.detail-body{ padding:20px }
.detail-summary{ font-size:13px; color:var(--text-secondary); line-height:1.6; margin-bottom:16px }
.detail-bullets{ list-style:none; margin-bottom:16px }
.detail-bullets li{
  font-size:13px; color:var(--text-secondary); padding:5px 0 5px 20px;
  position:relative; line-height:1.5;
}
.detail-bullets li::before{ content:'→'; position:absolute; left:0; color:var(--person-accent); font-size:11px; top:7px }
.detail-section-title{
  font-size:11px; font-weight:600; text-transform:uppercase;
  letter-spacing:.08em; color:var(--text-muted); margin-bottom:8px; margin-top:16px;
}
.detail-notes{
  font-size:12px; color:var(--text-muted); line-height:1.5;
  padding:10px 12px; background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius-sm); font-style:italic;
}
.detail-source-link{
  display:inline-flex; align-items:center; gap:6px; font-size:12px;
  color:var(--accent); background:rgba(0,212,255,.08);
  border:1px solid rgba(0,212,255,.2); border-radius:var(--radius-sm);
  padding:7px 12px; margin-top:16px; transition:var(--transition);
  width:100%; justify-content:center;
}
.detail-source-link:hover{ background:rgba(0,212,255,.15) }
.change-history{ list-style:none }
.change-history li{
  font-size:12px; color:var(--text-secondary);
  padding:5px 0 5px 16px; position:relative;
  border-left:1px solid var(--border); margin-left:6px; line-height:1.4;
}
.change-history li::before{
  content:''; position:absolute; left:-4px; top:9px;
  width:7px; height:7px; border-radius:50%; background:var(--border-bright);
}

/* ================================================================
   TIMELINE
================================================================ */
.timeline-wrap{ position:relative; padding-left:28px }
.timeline-line{ position:absolute; left:8px; top:0; bottom:0; width:2px; background:var(--border) }
.timeline-item{ position:relative; margin-bottom:20px }
.timeline-dot{
  position:absolute; left:-24px; top:4px;
  width:12px; height:12px; border-radius:50%;
  border:2px solid var(--bg-surface); background:var(--border-bright);
}
.timeline-dot.milestone{ background:var(--person-accent) }
.timeline-dot.change   { background:var(--amber) }
.timeline-dot.result   { background:var(--green) }
.timeline-dot.protocol { background:var(--purple) }
.timeline-year{ font-size:11px; font-weight:700; color:var(--text-muted); font-family:var(--font-mono); margin-bottom:3px }
.timeline-event{
  font-size:13px; color:var(--text-secondary); line-height:1.5;
  padding:10px 14px; background:var(--bg-surface); border:1px solid var(--border);
  border-radius:var(--radius); transition:var(--transition);
}
.timeline-event:hover{ border-color:var(--border-bright); background:var(--bg-elevated) }
.timeline-type-badge{
  font-size:10px; font-weight:600; padding:2px 6px;
  border-radius:4px; margin-bottom:4px; display:inline-block;
}
.type-milestone{ background:rgba(0,212,255,.1); color:var(--accent) }
.type-change   { background:rgba(245,158,11,.1); color:var(--amber) }
.type-result   { background:rgba(34,197,94,.1);  color:var(--green) }
.type-protocol { background:rgba(168,85,247,.1); color:var(--purple) }

/* ================================================================
   NEWS & PODCAST — full redesign
================================================================ */
.np-layout{ display:grid; grid-template-columns:1fr 420px; gap:20px; align-items:start }

/* news column */
.news-col-header{
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em;
  color:var(--text-muted); margin-bottom:14px;
  display:flex; align-items:center; gap:8px;
}
.news-col-header::after{ content:''; flex:1; height:1px; background:var(--border) }

.news-cards{ display:flex; flex-direction:column; gap:10px }
.news-card{
  display:flex; gap:14px; align-items:flex-start;
  padding:14px 16px;
  background:var(--bg-surface); border:1px solid var(--border);
  border-radius:var(--radius); text-decoration:none; color:inherit;
  transition:var(--transition);
}
.news-card:hover{
  border-color:var(--person-accent);
  background:var(--bg-elevated);
  transform:translateX(3px);
  box-shadow: 0 4px 16px rgba(0,0,0,.3), -2px 0 0 var(--person-accent);
}
.news-card-index{
  font-size:12px; font-weight:700; font-family:var(--font-mono);
  color:var(--person-accent); opacity:.5; flex-shrink:0;
  padding-top:1px; width:18px;
}
.news-card-body{ flex:1; min-width:0 }
.news-card-title{
  font-size:13px; font-weight:600; line-height:1.4;
  color:var(--text-primary); margin-bottom:5px;
}
.news-card-meta{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.news-card-date{ font-size:11px; color:var(--text-muted); font-family:var(--font-mono) }
.news-card-source{
  font-size:10px; font-weight:700; text-transform:uppercase;
  letter-spacing:.06em; padding:2px 7px; border-radius:4px;
  background:var(--bg-card); border:1px solid var(--border);
  color:var(--text-muted);
}
.news-card-arrow{
  font-size:14px; color:var(--person-accent); flex-shrink:0;
  opacity:.6; transition:var(--transition);
}
.news-card:hover .news-card-arrow{ opacity:1; transform:translateX(2px) }

/* podcast column */
.pod-col{ display:flex; flex-direction:column; gap:16px }
.pod-col-header{
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em;
  color:var(--text-muted); margin-bottom:14px;
  display:flex; align-items:center; gap:8px;
}
.pod-col-header::after{ content:''; flex:1; height:1px; background:var(--border) }

.spotify-card{
  background:var(--bg-surface); border:1px solid var(--border);
  border-radius:var(--radius-lg); overflow:hidden;
}
.spotify-card-header{
  padding:14px 16px 12px;
  display:flex; align-items:center; gap:11px;
}
.spotify-logo{
  width:32px; height:32px; flex-shrink:0; border-radius:50%;
  background:#1DB954; display:flex; align-items:center; justify-content:center;
}
.spotify-logo svg{ width:18px; height:18px }
.spotify-info{ flex:1; min-width:0 }
.spotify-show-name{ font-size:13px; font-weight:700; line-height:1.2; margin-bottom:2px }
.spotify-show-sub{ font-size:11px; color:var(--text-muted) }
.spotify-open{
  font-size:11px; font-weight:600; color:#1DB954;
  background:rgba(29,185,84,.1); border:1px solid rgba(29,185,84,.25);
  border-radius:99px; padding:4px 12px; text-decoration:none;
  transition:var(--transition); white-space:nowrap; flex-shrink:0;
}
.spotify-open:hover{ background:rgba(29,185,84,.2) }
.spotify-embed-wrap{
  padding:0 12px 12px;
}
.spotify-embed-wrap iframe{
  width:100%; border-radius:var(--radius-sm);
  display:block;
}
.spotify-ep-label{
  font-size:11px; font-weight:600; text-transform:uppercase;
  letter-spacing:.08em; color:var(--text-muted);
  padding:10px 16px 6px; border-top:1px solid var(--border);
}

/* ================================================================
   ALL-VIEW COMPOSITES
================================================================ */
.all-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px }
.all-person-card{
  background:var(--bg-surface); border:1px solid var(--border);
  border-radius:var(--radius-lg); overflow:hidden;
  transition:var(--transition); cursor:pointer;
}
.all-person-card:hover{
  border-color:var(--card-accent);
  transform:translateY(-2px);
  box-shadow:0 6px 24px rgba(0,0,0,.35);
}
.all-card-header{
  padding:16px;
  display:flex; align-items:center; gap:14px;
  border-bottom:1px solid var(--border);
  position:relative;
}
.all-card-header::before{
  content:''; position:absolute; top:0; left:0; right:0;
  height:3px; background:linear-gradient(90deg, var(--card-accent), var(--card-accent)80);
  box-shadow: 0 0 8px var(--card-accent);
}
.all-card-photo{
  width:80px; height:96px; border-radius:var(--radius);
  object-fit:cover; object-position:center 15%;
  border:2px solid var(--card-accent);
  flex-shrink:0;
  box-shadow:0 4px 14px rgba(0,0,0,.4);
  transition: transform 0.3s ease;
}
.all-card-header:hover .all-card-photo{ transform:scale(1.04) }
.all-card-photo-fallback{
  width:80px; height:96px; border-radius:var(--radius);
  background:var(--bg-elevated); border:2px solid var(--card-accent);
  display:flex; align-items:center; justify-content:center;
  font-size:26px; font-weight:800; color:var(--card-accent);
  flex-shrink:0;
}
.all-card-meta{ flex:1; min-width:0 }
.all-card-name{ font-size:15px; font-weight:700; letter-spacing:-.01em; margin-bottom:2px }
.all-card-title{ font-size:11px; color:var(--text-muted); margin-bottom:6px }
.all-card-age{
  font-size:11px; font-weight:600; padding:2px 8px;
  border-radius:99px; border:1px solid var(--card-accent);
  color:var(--card-accent); background:rgba(0,0,0,.2);
  display:inline-block;
}
.all-card-recs{ padding:14px 16px; border-bottom:1px solid var(--border) }
.all-card-rec-item{
  display:flex; gap:8px; align-items:baseline;
  padding:4px 0;
}
.all-card-rec-bullet{
  width:5px; height:5px; border-radius:50%;
  background:var(--card-accent); flex-shrink:0; margin-top:5px; opacity:.6;
}
.all-card-rec-text{
  font-size:12px; color:var(--text-secondary); line-height:1.4;
}
.all-card-footer{
  padding:10px 16px; display:flex; gap:8px;
}
.all-card-btn{
  flex:1; padding:7px 10px; border-radius:var(--radius-sm);
  font-size:11px; font-weight:600; text-align:center;
  cursor:pointer; transition:var(--transition);
  border:1px solid var(--border); background:var(--bg-card);
  color:var(--text-secondary);
}
.all-card-btn:hover{ border-color:var(--card-accent); color:var(--card-accent) }
.all-card-btn.primary{
  background:var(--card-accent); border-color:var(--card-accent);
  color:var(--text-inverse);
}
.all-card-btn.primary:hover{ opacity:.85 }

/* crossref table */
.crossref-wrap{
  background:var(--bg-surface); border:1px solid var(--border);
  border-radius:var(--radius-lg); overflow:hidden;
}
.crossref-table{ width:100%; border-collapse:collapse }
.crossref-table th{
  padding:12px 10px; text-align:center; font-size:11px; font-weight:600;
  text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted);
  background:var(--bg-card); border-bottom:1px solid var(--border);
  white-space:nowrap;
}
.crossref-table th:first-child { text-align:left; padding-left:16px; min-width:200px; }
.crossref-table td{
  padding:11px 14px; border-bottom:1px solid var(--border); font-size:12px;
  vertical-align:middle;
}
.crossref-table tr:last-child td{ border-bottom:none }
.crossref-table tr:hover td{ background:var(--bg-elevated) }
.dot-yes{ color:var(--green); font-size:16px; filter:drop-shadow(0 0 4px currentColor) }
.dot-no { color:var(--border-bright); font-size:14px; opacity:.35 }
.dot-partial{ color:var(--amber); font-size:16px; filter:drop-shadow(0 0 3px rgba(245,158,11,.4)) }
.matrix-cell { text-align:center; cursor:pointer; transition:var(--transition) }
.matrix-cell:hover { background:var(--bg-elevated) }

/* ================================================================
   OVERVIEW PANELS
================================================================ */
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:16px }
.panel-section{
  background:var(--bg-surface); border:1px solid var(--border);
  border-radius:var(--radius-lg); overflow:hidden;
}
.panel-header{
  padding:13px 18px; border-bottom:1px solid var(--border);
  background:var(--bg-card); display:flex; align-items:center; justify-content:space-between;
}
.panel-title{ font-size:13px; font-weight:600 }
.news-item{
  padding:13px 18px; border-bottom:1px solid var(--border);
  transition:var(--transition); display:flex; gap:12px; align-items:flex-start;
}
.news-item:last-child{ border-bottom:none }
.news-item:hover{ background:var(--bg-elevated) }
.news-date{ font-size:11px; color:var(--text-muted); font-family:var(--font-mono); white-space:nowrap; padding-top:2px }
.news-title{ font-size:13px; color:var(--text-primary); line-height:1.4; font-weight:500 }
.news-link{ color:var(--accent); font-size:11px; margin-top:3px; display:block }
.news-link:hover{ text-decoration:underline }

/* ================================================================
   MODAL
================================================================ */
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.75);
  backdrop-filter:blur(4px); z-index:999;
  display:flex; align-items:center; justify-content:center;
  padding:24px; opacity:0; pointer-events:none; transition:opacity var(--transition);
}
.modal-overlay.open{ opacity:1; pointer-events:auto }
.modal{
  background:var(--bg-surface); border:1px solid var(--border-bright);
  border-radius:var(--radius-lg); padding:28px; max-width:480px; width:100%;
  box-shadow:var(--shadow-lg); transform:translateY(12px); transition:transform var(--transition);
}
.modal-overlay.open .modal{ transform:translateY(0) }
.modal-title{ font-size:17px; font-weight:700; margin-bottom:6px }
.modal-sub{ font-size:13px; color:var(--text-secondary); margin-bottom:20px }
.form-row{ margin-bottom:14px }
.form-label{ font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:5px; display:block }
.form-input{
  width:100%; padding:9px 12px; background:var(--bg-card);
  border:1px solid var(--border); border-radius:var(--radius-sm);
  color:var(--text-primary); font-size:13px; outline:none; transition:var(--transition);
}
.form-input:focus{ border-color:var(--border-bright) }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:20px }
.btn-primary{
  padding:8px 18px; background:var(--person-accent); color:var(--text-inverse);
  border-radius:var(--radius-sm); font-size:13px; font-weight:600; cursor:pointer;
  border:none; transition:var(--transition);
}
.btn-primary:hover{ opacity:.85 }
.btn-ghost{
  padding:8px 18px; background:var(--bg-card); color:var(--text-secondary);
  border-radius:var(--radius-sm); font-size:13px; font-weight:500;
  cursor:pointer; border:1px solid var(--border); transition:var(--transition);
}
.btn-ghost:hover{ background:var(--bg-elevated); color:var(--text-primary) }

/* ================================================================
   ANIMATIONS + RESPONSIVE
================================================================ */
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.fade-in{ animation:fadeInUp .25s ease both }

@media(max-width:1100px){
  .stats-grid{ grid-template-columns:repeat(3,1fr) }
  .split-layout{ grid-template-columns:1fr }
  .detail-panel{ position:static }
  .np-layout{ grid-template-columns:1fr }
  .all-grid{ grid-template-columns:repeat(2,1fr) }
}
@media(max-width:768px){
  .main{ padding:16px }
  .person-hero{ flex-direction:column; gap:16px }
  .hero-photo-wrap{ width:90px; height:112px }
  .stats-grid{ grid-template-columns:repeat(2,1fr); gap:8px }
  .hero-name{ font-size:20px }
  .app-header{ padding:0 16px }
  .person-selector{ padding:8px 16px }
  .two-col{ grid-template-columns:1fr }
  .all-grid{ grid-template-columns:1fr }
  .all-aggregate-stats{ grid-template-columns:repeat(2,1fr) }
}

/* ================================================================
   NEWS & PODCASTS — 3-column layout
================================================================ */
.np-three-col {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 18px;
  align-items: start;
}
.np-col { display: flex; flex-direction: column; gap: 0 }
.np-col-hdr {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.np-col-hdr-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .1em; color: var(--text-muted);
}
.np-col-count {
  font-size: 10px; font-weight: 700;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 99px; padding: 2px 7px; color: var(--text-muted);
}
.np-empty { font-size: 12px; color: var(--text-muted); padding: 12px 0 }

/* YouTube / Spotify episode list items */
.yt-list { display: flex; flex-direction: column; gap: 0 }
.yt-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  text-decoration: none; color: inherit;
  transition: var(--transition);
}
.yt-item:hover {
  border-color: var(--person-accent);
  background: var(--bg-elevated);
  transform: translateX(2px);
}
.yt-num {
  font-size: 11px; font-weight: 700; font-family: var(--font-mono);
  color: var(--text-muted); flex-shrink: 0; padding-top: 2px; width: 18px;
}
.yt-title {
  font-size: 12px; font-weight: 600; color: var(--text-primary);
  line-height: 1.4; margin-bottom: 4px;
}
.yt-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.yt-views {
  font-size: 10px; font-weight: 700; color: var(--person-accent);
}
.yt-date { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono) }
.yt-channel {
  font-size: 10px; color: var(--text-muted);
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px;
}
.yt-arrow {
  font-size: 12px; color: var(--person-accent);
  flex-shrink: 0; opacity: .5; transition: var(--transition);
}
.yt-item:hover .yt-arrow { opacity: 1 }

@media(max-width:1200px){
  .np-three-col { grid-template-columns: 1fr 1fr }
}
@media(max-width:768px){
  .np-three-col { grid-template-columns: 1fr }
}

/* ── Sortable stack table headers ── */
.stack-th {
  cursor: pointer;
  user-select: none;
  transition: color var(--transition);
  white-space: nowrap;
}
.stack-th:hover { color: var(--text-primary) !important }
.sort-icon {
  display: inline-block;
  font-size: 10px;
  opacity: 0.35;
  margin-left: 4px;
  transition: all var(--transition);
  font-style: normal;
}

/* Light mode badge fixes */
[data-theme="light"] .badge-primary   { background:rgba(34,197,94,.15); color:#16a34a }
[data-theme="light"] .badge-secondary { background:rgba(245,158,11,.15); color:#d97706 }
[data-theme="light"] .badge-commentary{ background:rgba(168,85,247,.15); color:#9333ea }
[data-theme="light"] .badge-current   { background:rgba(34,197,94,.15); color:#16a34a }
[data-theme="light"] .badge-archived  { background:rgba(239,68,68,.15);  color:#dc2626 }
[data-theme="light"] .conf-dot        { background:rgba(0,0,0,.15) }
[data-theme="light"] .conf-dot.filled { background:var(--person-accent) }
[data-theme="light"] .topic-tag {
  background:rgba(0,0,0,.06); border-color:rgba(0,0,0,.1); color:#374155;
}

/* ── Stack detail expand row ── */
.stack-detail-row td { 
  transition: all .2s ease;
}
.stack-detail-row {
  animation: expandRow .2s ease;
}
@keyframes expandRow {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
/* ── Comparison matrix row hover ── */
.crossref-table tbody tr:hover td {
  background: var(--bg-elevated);
}
.crossref-table tbody tr td:first-child {
  font-weight: 600; font-size: 13px; padding-left: 16px;
}
/* ── Glow on badge-primary ── */
.badge-primary {
  box-shadow: 0 0 6px rgba(34,197,94,.2);
}
/* ── Person-chip active glow ── */
.person-chip.active {
  box-shadow: 0 0 0 1px var(--person-accent), 0 2px 10px rgba(0,0,0,.3), 0 0 16px color-mix(in srgb, var(--person-accent) 25%, transparent);
}
/* ── Stack table header ── */
#stackTable thead tr {
  background: var(--bg-card);
}
/* ── Filter chip active glow ── */
.filter-chip.active {
  box-shadow: 0 0 8px color-mix(in srgb, var(--person-accent) 40%, transparent);
}

/* ================================================================
   LIVE FETCH / REFRESH UI
================================================================ */
.refresh-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  gap: 12px;
}
.refresh-status {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--text-muted);
}
.refresh-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--border-bright);
  flex-shrink: 0; transition: background .3s;
}
.refresh-dot.live   { background: var(--green); box-shadow: 0 0 6px var(--green); }
.refresh-dot.loading { background: var(--amber); 
  animation: dotPulse 0.8s ease-in-out infinite; }
.refresh-dot.error  { background: var(--red); }
@keyframes dotPulse {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:.4; transform:scale(.7); }
}
.refresh-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: var(--radius-sm);
  background: var(--bg-elevated); border: 1px solid var(--border-bright);
  color: var(--text-secondary); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: var(--transition); white-space: nowrap;
}
.refresh-btn:hover { border-color: var(--person-accent); color: var(--person-accent); }
.refresh-btn:disabled { opacity: .5; cursor: not-allowed; }
.refresh-btn.spinning .refresh-icon { animation: spin360 .8s linear infinite; }
@keyframes spin360 { to { transform: rotate(360deg); } }
.refresh-icon { display: inline-block; font-size: 13px; }
.live-item-new {
  animation: flashIn .4s ease;
}
@keyframes flashIn {
  from { background: rgba(34,197,94,.15); }
  to   { background: transparent; }
}
.fetch-skeleton {
  height: 54px; border-radius: var(--radius-sm);
  background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-elevated) 50%, var(--bg-card) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
  margin-bottom: 6px;
}
@keyframes shimmer { to { background-position: -200% 0; } }
.np-api-note {
  font-size: 10px; color: var(--text-muted);
  padding: 6px 0; text-align: right;
}

/* ================================================================
   MEDIA MODAL — YouTube + Spotify inline player
================================================================ */
.media-modal-backdrop {
  position: fixed; inset: 0; z-index: 10000;
  background: rgba(0,0,0,.85); backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center;
  padding: 24px; opacity: 0; transition: opacity .2s ease;
}
.media-modal-backdrop.open { display: flex; opacity: 1; }
.media-modal {
  background: var(--bg-surface);
  border: 1px solid var(--border-bright);
  border-radius: var(--radius-lg);
  max-width: 920px; width: 100%;
  max-height: 90vh; overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 24px 64px rgba(0,0,0,.7);
  transform: translateY(10px);
  transition: transform .2s ease;
}
.media-modal-backdrop.open .media-modal { transform: translateY(0); }
.media-modal-header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  background: var(--bg-card);
}
.media-modal-icon {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.media-modal-title {
  flex: 1; font-size: 13px; font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.media-modal-meta {
  font-size: 11px; color: var(--text-muted);
  font-family: var(--font-mono);
}
.media-modal-actions { display: flex; gap: 6px; }
.media-modal-btn {
  padding: 5px 10px; border-radius: var(--radius-sm);
  background: var(--bg-elevated); border: 1px solid var(--border);
  color: var(--text-secondary); font-size: 11px; font-weight: 600;
  cursor: pointer; transition: var(--transition);
}
.media-modal-btn:hover { border-color: var(--person-accent); color: var(--person-accent); }
.media-modal-close {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--bg-elevated); border: 1px solid var(--border);
  color: var(--text-secondary); font-size: 14px;
  cursor: pointer; transition: var(--transition);
  display: flex; align-items: center; justify-content: center;
}
.media-modal-close:hover { background: var(--red); color: white; border-color: var(--red); }
.media-modal-body {
  flex: 1; overflow: auto;
  display: flex; align-items: center; justify-content: center;
  min-height: 400px;
  background: #000;
}
.media-modal-body iframe {
  width: 100%; height: 100%;
  border: none; display: block;
}
.media-modal-body.spotify-mode { background: var(--bg-base); padding: 20px; min-height: 200px; }

/* ============================================================
   TOPIC FILTER CHIPS (All Protocols view)
============================================================ */
.topic-chip {
  padding: 7px 12px;
  border-radius: 99px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.topic-chip:hover {
  border-color: var(--accent);
  color: var(--text-primary);
  background: var(--bg-elevated);
  transform: translateY(-1px);
}
.topic-chip.active {
  background: var(--accent);
  color: var(--text-inverse, #0a0a0a);
  border-color: var(--accent);
  box-shadow: 0 2px 8px rgba(232, 121, 249, 0.25);
}
.topic-chip.active span { opacity: .8; }

/* ============================================================
   EXPANDABLE ROWS IN ALL PROTOCOLS
============================================================ */
.all-rec-row { cursor: pointer; }
.all-rec-row:hover { background: var(--bg-elevated); }
.all-rec-row.expanded {
  background: var(--bg-elevated);
  border-left-color: var(--accent) !important;
}
.all-rec-row.expanded .expand-caret {
  color: var(--accent);
  transform: rotate(90deg);
}
.all-rec-detail { animation: expandDown .2s ease; }
@keyframes expandDown {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* ============================================================
   AI ANALYSIS PANEL (Gemini-powered news summary)
============================================================ */
.ai-panel {
  margin-bottom: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--bg-surface), var(--bg-card));
  position: relative;
  overflow: hidden;
}
.ai-panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--ai-accent, var(--accent)), transparent);
}
.ai-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-card);
}
.ai-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 99px;
  background: linear-gradient(135deg, rgba(232,121,249,.1), rgba(168,85,247,.08));
  border: 1px solid rgba(232,121,249,.3);
  font-size: 11px;
  font-weight: 700;
  color: #e879f9;
  text-transform: uppercase;
  letter-spacing: .05em;
}
.ai-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-family: var(--font-mono);
}
.ai-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.ai-dot-loading {
  background: var(--amber);
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .5; transform: scale(.8); }
}
.ai-panel-body { padding: 14px 18px; }
.ai-section { margin-bottom: 14px; }
.ai-section:last-child { margin-bottom: 0; }
.ai-section-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-secondary);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: .05em;
}
.ai-summary-text {
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.55;
}
.ai-topic-chip {
  padding: 3px 9px;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  font-size: 11px;
  font-weight: 600;
}
.ai-alert {
  padding: 9px 12px;
  border-radius: 6px;
  margin-bottom: 5px;
  border-left: 3px solid var(--amber);
  background: rgba(245, 158, 11, .05);
}
.ai-alert:last-child { margin-bottom: 0; }
.ai-alert-change { border-left-color: var(--amber); background: rgba(245,158,11,.06); }
.ai-alert-stack  { border-left-color: #e879f9; background: rgba(232,121,249,.06); }
.ai-skeleton {
  height: 14px;
  background: linear-gradient(90deg, var(--bg-card), var(--bg-elevated), var(--bg-card));
  background-size: 200% 100%;
  border-radius: 4px;
  margin-bottom: 7px;
  animation: shimmer 1.6s infinite;
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

/* ============================================================
   YOUTUBE FILTER BAR (All / Own Channel / Interviews)
============================================================ */
.yt-filter-bar {
  display: flex; gap: 4px; padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-card);
}
.yt-filter-btn {
  flex: 1; padding: 5px 8px;
  font-size: 11px; font-weight: 600;
  border-radius: 6px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s ease;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  white-space: nowrap;
  font-family: inherit;
}
.yt-filter-btn:hover {
  background: var(--bg-elevated);
  color: var(--text-secondary);
}
.yt-filter-btn.active {
  background: var(--bg-elevated);
  border-color: var(--border-bright);
  color: var(--text-primary);
  box-shadow: 0 1px 2px rgba(0,0,0,.3);
}
.yt-filter-dot {
  width: 6px; height: 6px; border-radius: 50%;
  display: inline-block;
}
</style>

// ================================================================
// STATE

let currentPersonId = 'ALL';

let selectedRecId = null;
let activeTopicFilter = 'All';
let activeSourceFilter = 'All';
let activeConfFilter = 0;
let searchQuery = '';
let customPeople = [];
let db;

// Spotify state
let spotifyController = null;
let spotifyApiReady = false;
let pendingSpotifyUri = null;

window.onSpotifyIframeApiReady = (IFrameAPI) => {
  spotifyApiReady = true;
  window._spotifyAPI = IFrameAPI;
  if (pendingSpotifyUri) {
    createSpotifyEmbed(IFrameAPI, pendingSpotifyUri);
    pendingSpotifyUri = null;
  }
};

function createSpotifyEmbed(IFrameAPI, uri) {
  const el = document.getElementById('spotify-embed-container');
  if (!el) return;
  if (spotifyController) {
    try { spotifyController.loadUri(uri); return; } catch(e) { spotifyController = null; }
  }
  const dark = document.documentElement.getAttribute('data-theme') !== 'light';
  const opts = { uri, width:'100%', height:'152' };
  if (dark) opts.theme = 'dark';
  IFrameAPI.createController(el, opts, ctrl => { spotifyController = ctrl; });
}

function loadSpotifyShow(showId, type) {
  const uri = type === 'episode'
    ? `spotify:episode:${showId}`
    : `spotify:show:${showId}`;
  if (spotifyApiReady && window._spotifyAPI) {
    createSpotifyEmbed(window._spotifyAPI, uri);
  } else {
    pendingSpotifyUri = uri;
    spotifyController = null;
  }
}

function switchPerson(id) {
  currentPersonId = id;
  currentTab = id === 'ALL' ? 'overview' : 'overview';
  if (id === 'MY_STACK') {
    document.documentElement.style.setProperty('--person-accent', '#e879f9');
  }
  selectedRecId = null;
  activeTopicFilter = 'All';
  activeSourceFilter = 'All';
  activeConfFilter = 0;
  searchQuery = '';
  spotifyController = null;
  renderSelector();
  renderPerson(id);
}

// ================================================================
// MAIN RENDER ROUTER
// ================================================================
function renderPerson(id) {
  const main = document.getElementById('mainContent');
  if (id === 'MY_STACK') {
    renderMyStack(main);
  } else if (id === 'ALL') {
    renderAllView(main);
  } else {
    const allPeople = [...db.people, ...customPeople];
    const p = allPeople.find(x => x.id === id);
    if (!p) return;
    document.documentElement.style.setProperty('--person-accent', p.accentColor);
    main.innerHTML = buildPersonShell(p);
    main.querySelectorAll('.tab-btn').forEach(btn =>
      btn.addEventListener('click', () => switchTab(btn.dataset.tab))
    );
    renderTabContent(p, currentTab);
  }
}

// ================================================================
// INDIVIDUAL PERSON SHELL
// ================================================================
function buildPersonShell(p) {
  const tabs = ['overview','protocols','bio','news'];
  const tabLabels = { overview:'Overview', protocols:'Source Matrix', bio:'Bio & Background', news:'News & Podcasts' };
  return `
  <div class="person-hero fade-in">
    <div class="hero-photo-wrap">
      <img class="hero-photo" src="${p.photo}" alt="${p.name}"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
      <div class="hero-photo-fallback" style="display:none">${p.photoFallback}</div>
    </div>
    <div class="hero-info">
      <div class="hero-name">${p.name}</div>
      <div class="hero-title">${p.title}</div>
      <div class="hero-tagline">"${p.tagline}"</div>
      <div class="hero-bio">${p.bio}</div>
      <div class="hero-meta">
        <span class="hero-badge accent">Born ${p.birthYear} · Age ${p.age}</span>
        <span class="hero-badge">Bio Age: ${p.bioAge}</span>
        <a href="${p.website}" target="_blank" rel="noopener" class="hero-link">↗ Official Site</a>
        <span class="hero-badge" style="color:var(--text-muted)">${p.twitter}</span>
      </div>
    </div>
  </div>
  <div class="stats-grid fade-in" id="statsGrid"></div>
  <div class="tab-bar">
    ${tabs.map(t=>`<button class="tab-btn${t===currentTab?' active':''}" data-tab="${t}">${tabLabels[t]}</button>`).join('')}
  </div>
  <div id="tabContent"></div>`;
}

function switchTab(tab) {
  currentTab = tab;
  selectedRecId = null;
  spotifyController = null;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  const allPeople = [...db.people, ...customPeople];
  const p = allPeople.find(x => x.id === currentPersonId);
  renderTabContent(p, tab);
}

function renderTabContent(p, tab) {
  const sg = document.getElementById('statsGrid');
  if (sg && p.stats) {
    sg.innerHTML = (p.stats||[]).map(s => `
    <div class="stat-card">
      <div class="stat-value">${s.value}</div>
      <div class="stat-label">${s.label}</div>
      <div class="stat-desc">${s.desc}</div>
    </div>`).join('');
  }
  const tc = document.getElementById('tabContent');
  if (!tc) return;
  if (tab === 'overview')  tc.innerHTML = renderOverview(p);
  if (tab === 'protocols') renderProtocols(p, tc);
  if (tab === 'bio')  tc.innerHTML = renderBio(p);
  if (tab === 'news') {
    tc.innerHTML = renderNewsTab(p);
    requestAnimationFrame(() => mountSpotify(p));
    // Auto-fetch live data when news tab opens
    autoFetchOnNewsTab(p.id);
  }
}

function renderProtocols(p, container) {
  const recs = db.recommendations.filter(r => r.personId === p.id);
  const topics = ['All', ...new Set(recs.map(r => r.topic))];
  container.innerHTML = `
  <div class="filter-bar fade-in">
    <input class="filter-input" id="searchInput" placeholder="Search protocols, keywords…"
           value="${searchQuery}" oninput="handleSearch(this.value)" />
    <select class="filter-select" id="sourceFilter" onchange="handleSourceFilter(this.value)">
      <option value="All">All Sources</option>
      <option value="primary">Primary Only</option>
      <option value="secondary">Secondary</option>
      <option value="commentary">Commentary</option>
    </select>
    <select class="filter-select" id="confFilter" onchange="handleConfFilter(this.value)">

function renderTopicChips(topics) {
  const tc = document.getElementById('topicChips');
  if (!tc) return;
  tc.innerHTML = topics.map(t =>
    `<button class="filter-chip${t===activeTopicFilter?' active':''}" onclick="handleTopicFilter('${t}')">${t}</button>`
  ).join('');
}

function getFilteredRecs() {
  let recs = db.recommendations.filter(r => r.personId === currentPersonId);
  if (activeTopicFilter !== 'All') recs = recs.filter(r => r.topic === activeTopicFilter);
  if (activeSourceFilter !== 'All') recs = recs.filter(r => r.sourceType === activeSourceFilter);
  if (activeConfFilter > 0) recs = recs.filter(r => r.confidence >= activeConfFilter);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    recs = recs.filter(r =>
      r.title.toLowerCase().includes(q) ||
      r.summary.toLowerCase().includes(q) ||
      r.topic.toLowerCase().includes(q) ||
      (r.bullets||[]).some(b => b.toLowerCase().includes(q))
    );
  }
  return recs;
}

function renderTable() {
  const tw = document.getElementById('tableWrap');
  if (!tw) return;
  const recs = getFilteredRecs();
  if (!recs.length) {
    tw.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-muted)">No protocols match your filters.</div>`;
    return;
  }
  tw.innerHTML = `
  <table class="recs-table">
    <thead>
      <tr><th>Topic</th><th>Protocol</th><th>Source</th><th>Date</th><th>Conf.</th><th>Status</th></tr>
    </thead>
    <tbody>
    ${recs.map(r=>`

function renderNewsTab(p) {
  const news = p.latestNews || [];
  const spotifyEps = (p.spotifyEpisodes || []).slice().sort((a,b) => {
    // Reuse parseDate defined below; simple inline version for safety
    const parse = (s) => {
      if (!s) return 0;
      const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
      const parts = String(s).toLowerCase().split(/\s+/).filter(Boolean);
      let y=0, m=0;
      for (const pt of parts) {
        const n = parseInt(pt);
        if (n && n>1900 && n<2100) y = n;
        const mi = months.findIndex(mn => pt.startsWith(mn));
        if (mi>=0) m = mi+1;
      }
      return y*100+m;
    };
    return parse(b.date) - parse(a.date);
  });
  // Sort YouTube interviews by date, newest first
  const parseDate = (s) => {
    if (!s) return 0;
    // Handles "Feb 2026", "Mar 2026", "2024", "Jan 2026" formats
    const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
    const parts = String(s).toLowerCase().split(/\s+/).filter(Boolean);
    let year = 0, month = 0;
    for (const part of parts) {
      const n = parseInt(part);
      if (n && n > 1900 && n < 2100) year = n;
      const m = months.findIndex(mn => part.startsWith(mn));
      if (m >= 0) month = m + 1;
    }
    return year * 100 + month;
  };
  const ytInterviews = (p.youtubeInterviews || []).slice().sort((a,b) => parseDate(b.date) - parseDate(a.date));
  const showId = p.spotifyShowId || '';
  const spotifyOpenUrl = `https://open.spotify.com/show/${showId}`;

  // ── Articles column ──
  const newsHtml = news.map((item, i) => `
  <a class="news-card" href="${item.url}" target="_blank" rel="noopener noreferrer">
    <div class="news-card-index">${String(i+1).padStart(2,'0')}</div>

  // ── Official podcast episodes (from their own show only) ──
  const spEpsHtml = spotifyEps.map((ep, i) => `
  <a class="yt-item media-clickable" href="${ep.url}"
     data-url="${encodeURIComponent(ep.url || '')}"
     data-title="${encodeURIComponent(ep.title || '')}"
     data-meta="${encodeURIComponent((ep.date||'') + (ep.duration ? ' · '+ep.duration : ''))}"
     style="border-left:3px solid #1DB954;cursor:pointer">

    <div style="flex:1;min-width:0">
      <div class="yt-title">${ep.title}</div>
      <div class="yt-meta">
        <span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:#1DB954">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#1DB954"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424a.622.622 0 01-.857.207c-2.348-1.435-5.304-1.76-8.785-.964a.622.622 0 11-.277-1.215c3.809-.87 7.077-.496 9.712 1.115a.622.622 0 01.207.857zm1.224-2.724a.78.78 0 01-1.072.257c-2.687-1.652-6.785-2.131-9.965-1.166a.78.78 0 01-.973-.519.781.781 0 01.519-.973c3.632-1.102 8.147-.568 11.234 1.329a.78.78 0 01.257 1.072zm.105-2.835C14.692 8.95 9.375 8.775 6.297 9.71a.937.937 0 11-.543-1.793c3.563-1.14 9.484-.871 13.22 1.337a.937.937 0 01-1.06 1.552l-.999-.941z"/></svg>

  </a>`).join('');

  // ── YouTube interviews list ──
  const ytHtml = ytInterviews.map((v, i) => `
  <a class="yt-item media-clickable" href="${v.url}"

function renderAllView(main) {
  document.documentElement.style.setProperty('--person-accent', '#00d4ff');
  const allPeople = [...db.people, ...customPeople];
  const totalRecs = db.recommendations.length;
  const primaryRecs = db.recommendations.filter(r=>r.sourceType==='primary').length;
  const avgConf = (db.recommendations.reduce((a,r)=>a+r.confidence,0)/db.recommendations.length).toFixed(1);

  // Build photo strip
  const stripHtml = allPeople.map(p => `
    <img class="strip-photo" src="${p.photo}" alt="${p.name}" style="border-color:${p.accentColor}"
         onerror="this.style.display='none'" />`
  ).join('');

  // Build ALL tabs
  const tabs = ['overview','protocols','compare'];
  const tabLabels = { overview:'Overview', protocols:'All Protocols', compare:'Comparison Matrix' };

  main.innerHTML = `
  <div class="all-hero fade-in">
    <div class="all-hero-top">
      <div class="all-photo-strip">${stripHtml}</div>
      <div>
        <div class="all-hero-title">All ${allPeople.length} Longevity Researchers</div>
        <div class="all-hero-sub">Composite view — ${totalRecs} protocol entries across ${allPeople.length} researchers</div>
        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
          ${allPeople.map(p=>`<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:${p.accentColor}20;border:1px solid ${p.accentColor}50;color:${p.accentColor}">${p.name.split(' ')[0]}</span>`).join('')}
        </div>
      </div>
    </div>
    <div class="all-aggregate-stats">
      <div class="agg-stat">
        <div class="agg-stat-val">${totalRecs}</div>
        <div class="agg-stat-label">Total Protocols</div>
        <div class="agg-stat-sub">Across all researchers</div>
      </div>
      <div class="agg-stat">
        <div class="agg-stat-val">${primaryRecs}</div>
        <div class="agg-stat-label">Primary Sources</div>
        <div class="agg-stat-sub">Direct from official sources</div>
      </div>
      <div class="agg-stat">
        <div class="agg-stat-val">${avgConf}</div>
        <div class="agg-stat-label">Avg Confidence</div>
        <div class="agg-stat-sub">Across all entries</div>
      </div>
      <div class="agg-stat">
        <div class="agg-stat-val">${allPeople.length}</div>
        <div class="agg-stat-label">Researchers</div>
        <div class="agg-stat-sub">+ Add more anytime</div>
      </div>
    </div>
  </div>

  <div class="tab-bar" id="allTabBar">
    ${tabs.map(t=>`<button class="tab-btn${t===currentTab?' active':''}" data-tab="${t}" onclick="switchAllTab('${t}')">${tabLabels[t]}</button>`).join('')}
  </div>
  <div id="allTabContent"></div>`;

  renderAllTabContent(currentTab);
}

function switchAllTab(tab) {
  currentTab = tab;
  document.querySelectorAll('#allTabBar .tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  renderAllTabContent(tab);
}

function renderAllTabContent(tab) {
  const tc = document.getElementById('allTabContent');
  if (!tc) return;
  if (tab === 'overview') tc.innerHTML = renderAllOverview();
  if (tab === 'protocols') renderAllProtocols(tc);
  if (tab === 'compare') tc.innerHTML = renderCompareMatrix();

  // re-attach event if needed
  if (tab !== 'compare') {
    requestAnimationFrame(() => {
      const el = document.getElementById('allSearch');
      if (el) el.focus && (el._attached || (el._attached = true));
    });
  }
}

function renderAllOverview() {
  const allPeople = [...db.people, ...customPeople];
  const cards = allPeople.map(p => {
    const recs = db.recommendations.filter(r=>r.personId===p.id);
    const topRecs = recs.slice(0,3);
    return `
    <div class="all-person-card" style="--card-accent:${p.accentColor}">
      <div class="all-card-header">
        <img class="all-card-photo" src="${p.photo}" alt="${p.name}"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
        <div class="all-card-photo-fallback" style="display:none">${p.photoFallback}</div>
        <div class="all-card-meta">
          <div class="all-card-name">${p.name}</div>
          <div class="all-card-title">${p.title}</div>
          <span class="all-card-age">Age ${p.age} · Bio: ${p.bioAge.split(' ')[0]}</span>
        </div>
      </div>
      <div class="all-card-recs">
        ${topRecs.map(r=>`
        <div class="all-card-rec-item">
          <div class="all-card-rec-bullet"></div>
          <div class="all-card-rec-text"><strong>${r.topic}:</strong> ${r.title.substring(0,55)}…</div>
        </div>`).join('')}
        ${recs.length > 3 ? `<div style="font-size:11px;color:var(--text-muted);margin-top:6px">+${recs.length-3} more protocols</div>` : ''}
      </div>
      <div class="all-card-footer">
        <button class="all-card-btn" onclick="switchPerson('${p.id}')">Full Profile →</button>
        <button class="all-card-btn primary" onclick="switchPersonTab('${p.id}','protocols')">Protocols</button>

  return `<div class="all-grid fade-in">${cards}</div>`;
}

function switchPersonTab(personId, tab) {
  currentPersonId = personId;
  currentTab = tab;
  selectedRecId = null;
  spotifyController = null;
  renderSelector();
  renderPerson(personId);
}

function renderAllProtocols(container) {
  // All recs from everyone, with person column
  const allPeople = [...db.people, ...customPeople];
  let recs = db.recommendations;
  
  // Get unique topics with counts, sorted by frequency descending
  const topicCounts = {};
  recs.forEach(r => { topicCounts[r.topic] = (topicCounts[r.topic] || 0) + 1; });
  const topicsByCount = Object.entries(topicCounts)
    .sort((a,b) => b[1] - a[1])
    .map(([t,c]) => ({ topic: t, count: c }));

  container.innerHTML = `
    <!-- Topic filter chips -->
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;padding:14px 16px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius)">
      <div style="width:100%;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Filter by Topic</div>
      <button class="topic-chip active" data-topic="All" onclick="selectTopicChip(this,'All')">
        All <span style="opacity:.6;font-family:var(--font-mono);font-size:10px">${recs.length}</span>
      </button>
      ${topicsByCount.map(({topic, count}) => `
        <button class="topic-chip" data-topic="${topic}" onclick="selectTopicChip(this,'${topic.replace(/'/g,"\\'")}')">
          ${topic} <span style="opacity:.6;font-family:var(--font-mono);font-size:10px">${count}</span>
        </button>
      `).join('')}
    </div>
    
    <!-- Secondary filter bar -->
    <div class="filter-bar fade-in">
      <input class="filter-input" id="allSearch" placeholder="Search all protocols…" oninput="filterAllRecs()" />
      <select class="filter-select" id="allPersonFilter" onchange="filterAllRecs()">
        <option value="All">All Researchers</option>
        ${allPeople.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
      </select>
      <select class="filter-select" id="allSourceFilter" onchange="filterAllRecs()">
        <option value="All">All Sources</option>
        <option value="primary">Primary Only</option>
        <option value="secondary">Secondary</option>
        <option value="commentary">Commentary</option>
      </select>
      <select class="filter-select" id="allConfFilter" onchange="filterAllRecs()">
        <option value="0">Any Confidence</option>
        <option value="4">4+ Stars</option>
        <option value="5">5 Stars Only</option>
      </select>
      <button class="filter-select" onclick="clearAllFilters()" style="cursor:pointer;background:var(--bg-card)" title="Clear all filters">
        Clear Filters
      </button>
    </div>
    
    <div class="table-wrap fade-in" id="allTableWrap"></div>`;
  renderAllTable(recs);
}

function selectTopicChip(el, topic) {
  // Toggle visual state
  document.querySelectorAll('.topic-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  window._currentTopicFilter = topic;
  filterAllRecs();
}

function clearAllFilters() {
  const search = document.getElementById('allSearch');
  const person = document.getElementById('allPersonFilter');
  const src = document.getElementById('allSourceFilter');
  const conf = document.getElementById('allConfFilter');
  if (search) search.value = '';
  if (person) person.value = 'All';
  if (src) src.value = 'All';
  if (conf) conf.value = '0';
  window._currentTopicFilter = 'All';
  document.querySelectorAll('.topic-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.topic === 'All');
  });
  filterAllRecs();
}

function filterAllRecs() {
  const q = (document.getElementById('allSearch')||{}).value || '';
  const personF = (document.getElementById('allPersonFilter')||{}).value || 'All';
  const topicF = window._currentTopicFilter || 'All';
  const srcF = (document.getElementById('allSourceFilter')||{}).value || 'All';
  const confF = parseInt((document.getElementById('allConfFilter')||{}).value || '0');
  
  let recs = db.recommendations;
  if (personF !== 'All') recs = recs.filter(r=>r.personId===personF);
  if (topicF !== 'All') recs = recs.filter(r=>r.topic===topicF);
  if (srcF !== 'All') recs = recs.filter(r=>r.sourceType===srcF);
  if (confF > 0) recs = recs.filter(r=>r.confidence >= confF);
  if (q) { 
    const ql=q.toLowerCase(); 
    recs=recs.filter(r => r.title.toLowerCase().includes(ql) || r.topic.toLowerCase().includes(ql) || r.summary.toLowerCase().includes(ql));
  }
  renderAllTable(recs);
}

// Toggle expansion of a row in All Protocols
function toggleAllRecRow(tr, recId) {
  const detail = document.getElementById('detail-' + recId);
  if (!detail) return;
  const isOpen = detail.style.display === 'table-row';
  // Close all others (accordion-style)
  document.querySelectorAll('.all-rec-detail').forEach(d => d.style.display = 'none');
  document.querySelectorAll('.all-rec-row').forEach(r => {
    r.classList.remove('expanded');
    const caret = r.querySelector('.expand-caret');
    if (caret) caret.style.transform = '';
  });
  if (!isOpen) {
    detail.style.display = 'table-row';
    tr.classList.add('expanded');
    const caret = tr.querySelector('.expand-caret');
    if (caret) caret.style.transform = 'rotate(90deg)';
  }
}

function renderStackCategoryChips() {
  const el = document.getElementById('stackCategoryChips');
  if (!el) return;
  const activeCat = (document.getElementById('stackCategoryFilter')||{}).value || '';
  const cats = Object.keys(CATEGORY_STYLES);
  el.innerHTML = cats.map(cat => {
    const s = CATEGORY_STYLES[cat] || CATEGORY_STYLES['Other'];
    const isActive = activeCat === cat;
    const count = HOFFMAN_SUPPLEMENTS.filter(x => x.category === cat).length;
    return `<button onclick="const cf=document.getElementById('stackCategoryFilter');if(cf){cf.value=cf.value==='${cat}'?'':'${cat}';selectedStackRow=null;filterStack();renderStackCategoryChips()}"
      style="font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;cursor:pointer;transition:all .15s;
             background:${isActive ? s.bg : 'var(--bg-card)'};
             border:1.5px solid ${isActive ? s.border : 'var(--border)'};
             color:${isActive ? s.color : 'var(--text-muted)'}">
      ${cat} <span style="opacity:.7">(${count})</span>
    </button>`;
  }).join('');
}

let stackSortCol = null;
let stackSortDir = 1; // 1=asc, -1=desc

function sortStack(col) {
  if (stackSortCol === col) {
    stackSortDir *= -1;
  } else {
    stackSortCol = col;
    stackSortDir = 1;
  }
  // Update all sort icons
  ['ingredient','dose','product','category','primaryBenefit'].forEach(c => {
    const el = document.getElementById('si-' + c);
    if (!el) return;
    if (c === stackSortCol) {
      el.textContent = stackSortDir === 1 ? '↑' : '↓';
      el.style.color = 'var(--person-accent)';
      el.style.opacity = '1';
    } else {
      el.textContent = '↕';
      el.style.color = '';
      el.style.opacity = '0.35';
    }
  });
  // Update active column header style
  document.querySelectorAll('.stack-th').forEach(th => {
    th.style.color = th.dataset.col === stackSortCol ? 'var(--person-accent)' : '';
  });
  filterStack(); // re-render with sort applied
}

function getStackSorted(data) {
  if (!stackSortCol) return data;
  return [...data].sort((a, b) => {
    let va = (a[stackSortCol] || '').toString().toLowerCase();
    let vb = (b[stackSortCol] || '').toString().toLowerCase();
    // For dose: try numeric sort on the leading number
    if (stackSortCol === 'dose') {
      const na = parseFloat(va.replace(/,/g,'')) || 0;
      const nb = parseFloat(vb.replace(/,/g,'')) || 0;
      return (na - nb) * stackSortDir;
    }
    if (va < vb) return -1 * stackSortDir;
    if (va > vb) return  1 * stackSortDir;
    return 0;
  });
}

  if (cat) data = data.filter(s=>s.category===cat);
  if (q) { const ql=q.toLowerCase(); data=data.filter(s=>[s.ingredient,s.primaryBenefit,s.benefits,s.category].join(' ').toLowerCase().includes(ql)); }
  renderStackTable(getStackSorted(data));

  // Re-render product grid and category chips to reflect active state
  if (typeof renderMyStackProductGrid === 'function') renderMyStackProductGrid();

function exportStackCSV() {
  if (typeof HOFFMAN_SUPPLEMENTS === 'undefined' || !HOFFMAN_SUPPLEMENTS.length) {
    alert('Stack data not loaded yet.');
    return;
  }
  // Proper CSV escape — wraps in quotes only when needed, escapes internal quotes
  const esc = (val) => {
    if (val == null) return '';
    const s = String(val);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  };
  const headers = ['Ingredient', 'Dose', 'Product', 'Category', 'Primary Benefit', 'Benefits'];
  const rows = [headers.map(esc).join(',')];
  HOFFMAN_SUPPLEMENTS.forEach(s => {
    rows.push([
      esc(s.ingredient),
      esc(s.dose),
      esc(s.product),
      esc(s.category),
      esc(s.primaryBenefit),
      esc((s.benefits || '').replace(/\s*\|\s*/g, ' | '))
    ].join(','));
  });
  // BOM makes Excel open UTF-8 correctly
  const csv = '\ufeff' + rows.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const today = new Date().toISOString().split('T')[0];
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob),
    download: `mh-stack-${today}.csv`
  });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ── CORS-safe fetch with fallback proxy ──
async function proxiedFetch(url) {
  const fetchWithTimeout = (u, ms) => {
    const ctrl = new AbortController();
    const id = setTimeout(() => ctrl.abort(), ms);
    return fetch(u, { signal: ctrl.signal }).finally(() => clearTimeout(id));
  };
  
  // Try each proxy in order until one works
  for (let i = 0; i < CORS_PROXIES.length; i++) {
    const proxy = CORS_PROXIES[i];
    try {
      const proxyUrl = proxy.url + encodeURIComponent(url);
      const res = await fetchWithTimeout(proxyUrl, FETCH_TIMEOUT);
      if (!res.ok) continue;  // try next proxy
      if (proxy.wraps) {
        const data = await res.json();
        if (data.contents) return data.contents;
      } else {
        const text = await res.text();
        if (text) return text;
      }
    } catch(e) {
      // move to next proxy
      continue;
    }
  }
  console.warn('[proxiedFetch] All proxies failed for:', url.substring(0,80));
  return null;
}

// ── Parse RSS/Atom XML into items ──
function parseRSS(xmlString) {
  if (!xmlString) return [];
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlString, 'text/xml');
    const items = [...doc.querySelectorAll('item, entry')].slice(0, 6);
    return items.map(item => {
      const title = item.querySelector('title')?.textContent?.trim() || 'Untitled';
      const link  = item.querySelector('link')?.textContent?.trim()
                 || item.querySelector('link')?.getAttribute('href')
                 || '#';
      const pub   = item.querySelector('pubDate,published,updated')?.textContent?.trim() || '';
      const src   = new URL(link.startsWith('http') ? link : 'https://example.com').hostname
                       .replace('www.','');
      return {
        title: title.substring(0, 100),
        url:   link,
        date:  pub ? new Date(pub).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : 'Recent',
        source: src,
        isLive: true
      };
    }).filter(i => i.url !== '#');
  } catch(e) {
    console.warn('RSS parse error:', e);
    return [];
  }
}

// Heuristic: detect if a video is likely a YouTube Short from title alone
function _isLikelyShort(item) {
  if (!item || !item.title) return false;
  const t = item.title.toLowerCase();
  // Common short indicators in titles
  if (t.includes('#shorts')) return true;
  if (t.includes('#short ')) return true;
  if (t.endsWith('#short')) return true;
  if (t.includes(' shorts ')) return true;
  if (t.startsWith('shorts:')) return true;
  // Very short punchy titles under 30 chars often shorts (noisy signal, skip)
  return false;
}

// Fetch videos from a specific channel
async function fetchYouTubeChannel(channelId) {
  if (!channelId || !YT_API_KEY) return [];
  // videoDuration=medium excludes shorts (<4min) and very long videos (>20min)
  // Fetch a few extra (10 instead of 8) to compensate for any shorts that sneak through
  // and are then filtered client-side
  const url = `https://www.googleapis.com/youtube/v3/search?key=${YT_API_KEY}&channelId=${channelId}&part=snippet&order=date&maxResults=15&type=video`;
  try {
    const res = await fetch(url);
    if (!res.ok) { 
      if (res.status === 403) lastYtError = 'YouTube API 403 — check key restrictions';
      else if (res.status === 429) lastYtError = 'YouTube quota exceeded';
      return []; 
    }
    const data = await res.json();
    if (!data.items) return [];
    return data.items.map(item => ({
      title: item.snippet.title,
      date: new Date(item.snippet.publishedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
      url: `https://www.youtube.com/watch?v=${item.id.videoId}`,
      channel: item.snippet.channelTitle,
      source: 'channel',
      isLive: true
    })).filter(v => !_isLikelyShort(v)).slice(0, 8);  // drop shorts, keep top 8
  } catch(e) {
    console.warn('[YT channel]', e.message);

  }
}

async function fetchYouTubeInterviews(personName, excludeChannelId) {

async function callGemini(prompt) {

    lastGeminiError = `Rate limited — cooling down ${waitSec}s`;
    return null;
  }
  
  // Space requests at least 4.5s apart (Groq free tier is 30 req/min on Llama 70B, plenty of headroom)
  const sinceLastCall = Date.now() - _geminiLastCall;
  if (sinceLastCall < GEMINI_MIN_INTERVAL) {
    await new Promise(r => setTimeout(r, GEMINI_MIN_INTERVAL - sinceLastCall));
  }
  _geminiLastCall = Date.now();
  
  const url = 'https://api.groq.com/openai/v1/chat/completions';
  try {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), 15000);
    const res = await fetch(url, {
      method: 'POST',
      signal: ctrl.signal,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + GROQ_API_KEY
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: [
          { role: 'system', content: 'You are a longevity research analyst. Always respond with valid JSON only — no markdown, no code fences, no prose before or after the JSON object.' },
          { role: 'user', content: prompt }
        ],
        temperature: 0.3,
        max_tokens: 1200,
        response_format: { type: 'json_object' }
      })
    });
    clearTimeout(tid);
    if (!res.ok) {
      const err = await res.text().catch(()=>'');
      if (res.status === 429) {
        // Rate limit — cooldown for 60s before trying again
        _geminiCooldownUntil = Date.now() + 60000;
        lastGeminiError = 'Rate limit exceeded — cooldown for 60s. Groq free tier is ~30 req/min.';
      } else if (res.status === 400) {
        lastGeminiError = 'Invalid request: ' + (err ? err.substring(0,200) : '');
      } else if (res.status === 401) {
        lastGeminiError = 'API key rejected — check Groq key is valid (console.groq.com/keys)';
      } else {
        lastGeminiError = 'HTTP ' + res.status + (err ? ' — ' + err.substring(0,150) : '');
      }
      console.warn('[Groq]', lastGeminiError);
      return null;
    }
    const data = await res.json();
    const text = data?.choices?.[0]?.message?.content;
    if (!text) { lastGeminiError = 'Empty response'; return null; }
    lastGeminiError = null;
    try { return JSON.parse(text); }
    catch {
      const cleaned = text.replace(/```json\s*|```\s*/g, '').trim();
      try { return JSON.parse(cleaned); }
      catch { 
        return { summary: text.substring(0, 500), protocolChanges: [], stackRelevance: [], topTopics: [] };
      }
    }
  } catch(e) {
    lastGeminiError = e.name === 'AbortError' ? 'Request timed out (>15s)' : e.message;
    console.warn('[Groq] error:', lastGeminiError);
    return null;
  }
}
